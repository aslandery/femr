name: Build Windows Wheel for femr

on:
  workflow_dispatch:  # 手动运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Patch dummy rules_cuda for CI
      shell: bash  # ✅ 使用 bash，因为 echo 是 bash 命令
      run: |
        echo 'local_repository(name = "rules_cuda", path = "C:/dummy")' >> WORKSPACE
        mkdir -p /c/dummy

    - name: Set up Python 3.10.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install Bazel via Chocolatey
      shell: powershell
      run: |
        choco install bazel -y
        $env:Path += ";C:\Program Files\Bazel"

    - name: Verify Bazel version
      run: bazel --version

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Build femr wheel
      run: |
        pip wheel . -w dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: femr-windows-wheel
        path: dist/*.whl
