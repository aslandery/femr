name: Build Windows Wheel for femr

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout create-from-v16 branch
      uses: actions/checkout@v3
      with:
        ref: create-from-v16

    - name: Patch dummy rules_cuda for CI
      shell: bash
      run: |
        echo 'local_repository(name = "rules_cuda", path = "C:/dummy")' >> WORKSPACE
        mkdir -p C:/dummy
        echo 'filegroup(name = "archs", srcs = [])' > C:/dummy/BUILD

    - name: Patch Boost mirror to SourceForge
      shell: bash
      run: |
        if grep -q "boost_1_80_0.tar.gz" native/WORKSPACE; then
          sed -i 's|https://boostorg.jfrog.io/artifactory/main/release/1.80.0/source/boost_1_80_0.tar.gz|https://downloads.sourceforge.net/project/boost/boost/1.80.0/boost_1_80_0.tar.gz|' native/WORKSPACE
        else
          echo "Boost source URL not found, skipping patch."
        fi

    - name: Patch pybind11_bazel URL and checksum
      shell: bash
      run: |
        sed -i 's|https://github.com/Lalaland/pybind11_bazel/archive/5a8209f6ddcc848272e27a36a5fc2b79e7438374.tar.gz|https://github.com/pybind/pybind11_bazel/archive/5a8209f6ddcc848272e27a36a5fc2b79e7438374.tar.gz|' native/WORKSPACE
        sed -i 's|sha256 = ".*"|sha256 = "cc9bd704ec128049f6b0c7a64313a690a3f53dac2f040e9d00d87cf33d45d9c1"|' native/WORKSPACE

    - name: Set up Python 3.10.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install Bazel
      uses: jwlawson/actions-setup-bazel@v2
      with:
        bazel-version: '6.5.0'

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Build femr wheel
      run: |
        pip wheel . -w dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: femr-windows-wheel
        path: dist/*.whl
