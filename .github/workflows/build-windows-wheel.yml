name: Build Windows Wheel for femr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install Bazel
      uses: philwo/setup-bazel@v4  # 更稳定的方式安装 Bazel
      with:
        bazel-version: 6.5.0  # 或者你实际需要的版本

    - name: Add dummy rules_cuda to WORKSPACE
      shell: bash
      run: |
        echo 'local_repository(name = "rules_cuda", path = "C:/dummy")' >> WORKSPACE
        mkdir -p /c/dummy

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1  # ✅ 正确配置 MSVC 环境

    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel

    - name: Build femr wheel
      run: |
        pip wheel . -w dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: femr-windows-wheel
        path: dist/*.whl
