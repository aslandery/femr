name: Build Windows Wheel for femr
# Triggered to force workflow recognition

on:
  workflow_dispatch:  # 手动运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Patch dummy rules_cuda for CI
      run: |
        echo local_repository\(name = \"rules_cuda\", path = \"C:/dummy\"\) >> WORKSPACE
        mkdir C:/dummy  # 创建一个假的空目录，防止 Bazel 报错

    - name: Set up Python 3.10.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install Bazel via Chocolatey
      shell: powershell
      run: |
        choco install bazel -y
        $env:PATH += ";C:\Program Files\Bazel"

    - name: Verify Bazel version
      run: bazel --version

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Build femr wheel
      run: |
        pip wheel . -w dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: femr-windows-wheel
        path: dist/*.whl
