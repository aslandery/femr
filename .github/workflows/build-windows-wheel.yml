name: Build Windows Wheel for femr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout create-from-v16 branch
      uses: actions/checkout@v3
      with:
        ref: create-from-v16

    - name: Patch dummy rules_cuda for CI
      shell: bash
      run: |
        echo 'local_repository(name = "rules_cuda", path = "C:/dummy")' >> WORKSPACE
        mkdir -p C:/dummy
        echo 'filegroup(name = "archs", srcs = [])' > C:/dummy/BUILD

    - name: Patch Boost URL to SourceForge
      shell: bash
      run: |
        sed -i 's|https://boostorg.jfrog.io/artifactory/main/release/1.80.0/source/boost_1_80_0.tar.gz|https://downloads.sourceforge.net/project/boost/boost/1.80.0/boost_1_80_0.tar.gz|' native/WORKSPACE
        sed -i 's|sha256 = ".*"|sha256 = "4b2136f98bdd1f5857f1c3dea9ac2018effe65286cf251534b6ae20cc45e1847"|' native/WORKSPACE

    - name: Set up Python 3.10.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install Bazel
      uses: jwlawson/actions-setup-bazel@v2
      with:
        bazel-version: '6.5.0'

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Build femr wheel
      run: |
        pip wheel . -w dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: femr-windows-wheel
        path: dist/*.whl
