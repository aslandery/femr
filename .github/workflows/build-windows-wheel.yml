name: Build Windows Wheel for femr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: List root files and locate WORKSPACE / MODULE.bazel
      shell: bash
      run: |
        echo "🔍 Listing project root files..."
        ls -al
        echo "🔍 Searching recursively for WORKSPACE or MODULE.bazel..."
        find . -name 'WORKSPACE' -o -name 'MODULE.bazel'

    - name: Patch dummy rules_cuda
      shell: bash
      run: |
        echo 'local_repository(name = "rules_cuda", path = "C:/dummy")' >> WORKSPACE
        mkdir -p C:/dummy

    - name: Patch boost checksum (disable SHA check)
      shell: bash
      run: |
        echo "🔧 Replacing boost checksum (fallback patch)"
        sed -i 's/4b2136f98bdd1f5857f1c3dea9ac2018effe65286cf251534b6ae20cc45e1847/79e6d3f986444e5a80afbeccdaf2d1c1cf964baa8d766d20859d653a16c39848/' native/WORKSPACE || echo "⚠️ boost patch skipped"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10.11'

    - name: Install Bazel via Chocolatey
      shell: powershell
      run: |
        choco install bazel -y
        $env:PATH += ";C:\Program Files\Bazel"

    - name: Verify Bazel version
      run: bazel --version

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Build femr wheel
      run: |
        pip wheel . -w dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: femr-windows-wheel
        path: dist/*.whl
